server:
  port: ${PORT:3000}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: dippie-backend
  profiles:
    default: demo
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      enabled: false
  mvc:
    async:
      request-timeout: PT120S

dippie:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration: ${APP_JWT_EXPIRATION:PT24H}
    playback-grant-validity: PT5M
  auth:
    rate-limit:
      max-attempts: 30
      window: PT1M
      max-clients: 4096
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  media:
    root: ${APP_MEDIA_ROOT:media}
    cache-root: ${APP_MEDIA_CACHE_ROOT:}
    drive-mount: ${APP_MEDIA_DRIVE_MOUNT:}
  assistant:
    llm:
      provider: ${DIPPIE_LLM_PROVIDER:template}
      base-url: ${LLM_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
      model: ${LLM_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
      api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
      timeout: PT60S
  web:
    dist: ${DIPPIE_WEB_DIST:../../frontend/dist}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:${DIPPIE_DATA_DIR:../../target/dippie-java}/dippie;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update

dippie:
  seed-demo-data: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:movie_rcm_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=UTC
    username: ${MYSQL_USER:dippie_app}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

dippie:
  seed-demo-data: false
