# Cấu hình chạy thật (production) cho Dippie Backend, bật bằng SPRING_PROFILES_ACTIVE=prod.
# JwtService tự kiểm tra APP_JWT_SECRET (Base64 từ 32 byte trở lên, không dùng khóa mẫu cũ)
# và chặn khởi động nếu profile không phải demo hay test.

server:
  port: ${PORT:3000}
  shutdown: graceful
  # Chỉ tin X-Forwarded-* từ reverse proxy nội bộ (Caddy trên mạng Docker riêng, RFC1918 hoặc loopback)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1
  compression:
    enabled: true
    min-response-size: 1KB
    # Bỏ qua text/event-stream (SSE /api/chat) và video/* để luồng không bị đệm
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - image/svg+xml
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Chỉ chạy MySQL, tắt hẳn H2 console khi lên production
  h2:
    console:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Mặc định yêu cầu TLS (sslMode=REQUIRED) và tắt allowPublicKeyRetrieval; có thể chỉnh lại qua biến môi trường
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:movie_rcm_db}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&characterEncoding=UTF-8&connectionTimeZone=UTC&serverTimezone=UTC
    username: ${MYSQL_USER:dippie_app}
    password: ${MYSQL_PASSWORD:}
    # Cấu hình pool HikariCP vừa sức cho VPS nhỏ (1-2 vCPU, 1-2 GB RAM)
    hikari:
      pool-name: dippie-hikari-prod
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 15000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 300000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: legacy-schema-01-to-13
  sql:
    init:
      mode: never

dippie:
  # Không tạo tài khoản và lịch sử mẫu khi chạy thật
  seed-demo-data: false
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration: ${APP_JWT_EXPIRATION:PT24H}
  # Chỉ tạo tài khoản admin khi đã điền đủ APP_BOOTSTRAP_ADMIN_PASSWORD cùng username và email
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  # Mặc định chỉ nhận request cùng nguồn qua Caddy; chỉ điền nếu frontend đặt khác domain
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Tắt OpenAPI và Swagger UI trên production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Chỉ mở health (liveness/readiness) và info của Actuator trên cổng quản trị nội bộ
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# Ghi log JSON theo chuẩn ECS trên production và giảm bớt log thừa
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.dippie: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
